<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园新闻网</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%238B2F2A'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23F6F5F2' font-family='serif' font-weight='700'%3E新%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  :root{
    --bg:#F6F5F2;
    --paper:#EFEDEA;
    --ink:#1C1E1C;
    --ink-soft:#3A3E3B;
    --muted:#6B706D;
    --line:#D9D7D2;
    --accent:#8B2F2A;
    --accent-soft:#F3E4E2;
    --max:720px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    font-size:17px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 报头 ===== */
  .masthead{
    max-width:var(--max);
    margin:0 auto;
    padding:56px 24px 0;
    text-align:center;
  }
  .masthead .edition{
    font-family:"Noto Sans SC", system-ui, sans-serif;
    font-size:12px;
    letter-spacing:.25em;
    color:var(--muted);
    margin-bottom:18px;
  }
  .masthead h1{
    font-size:56px;
    font-weight:900;
    letter-spacing:.12em;
    color:var(--ink);
    line-height:1.2;
    margin-bottom:18px;
  }
  .masthead .rule{
    border:0;
    border-top:2px solid var(--ink);
    margin:0 auto;
    max-width:100%;
  }
  .masthead .rule.thin{
    border-top:1px solid var(--line);
    margin-top:6px;
    border-bottom:1px solid var(--line);
  }
  .masthead .meta{
    font-family:"Noto Sans SC", system-ui, sans-serif;
    font-size:13px;
    color:var(--muted);
    padding:14px 0 0;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
  }

  /* ===== 新闻列表 ===== */
  main{
    max-width:var(--max);
    margin:0 auto;
    padding:32px 24px 80px;
  }
  article.news{
    padding:36px 0;
    border-bottom:1px solid var(--line);
  }
  article.news:last-child{border-bottom:none}

  .meta-row{
    font-family:"Noto Sans SC", system-ui, sans-serif;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.06em;
    margin-bottom:12px;
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
    align-items:baseline;
  }
  .meta-row .dot{color:var(--line)}
  .meta-row .weather{color:var(--accent)}
  .meta-row .reporter{color:var(--ink-soft)}

  h2.title{
    font-size:24px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:14px;
    color:var(--ink);
  }

  article.news p{
    color:var(--ink-soft);
    margin-bottom:14px;
    text-align:justify;
  }
  article.news p:last-child{margin-bottom:0}

  /* 报尾 */
  footer{
    max-width:var(--max);
    margin:0 auto;
    padding:24px 24px 56px;
    border-top:2px solid var(--ink);
    font-family:"Noto Sans SC", system-ui, sans-serif;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.1em;
    text-align:center;
  }

  /* 响应式 */
  @media (max-width:640px){
    body{font-size:16px}
    .masthead{padding:40px 20px 0}
    .masthead h1{font-size:38px;letter-spacing:.08em}
    h2.title{font-size:20px}
    .meta-row{font-size:11px;gap:4px 10px}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="edition">CC · 灵物阁 · 灵</div>
  <h1>校园新闻网</h1>
  <hr class="rule">
  <hr class="rule thin">
  <div class="meta">
    <span>20xx年xx月xx日</span>
    <span class="dot">·</span>
    <span>星期x</span>
    <span class="dot">·</span>
    <span>今日天气：xxxx 18–26℃</span>
    <span class="dot">
  </div>
</header>

<main>

  <article class="news">
    <div class="meta-row">
      <span>xxxx-xx-xx</span>
      <span>星期x</span>
      <span class="dot">|</span>
      <span>xx:xx</span>
      <span class="dot">|</span>
      <span class="weather">天气：xxxx</span>
      <span class="dot">|</span>
      <span class="reporter">发布人：xxx</span>
    </div>
    <h2 class="title">标题1</h2>
    <p>段落1</p>
    <p>段落2</p>
  </article>

</main>

<footer>
  CC · 灵物阁 · 灵
</footer>

</body>
</html>
